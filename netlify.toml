# netlify.toml
# Place this file in the ROOT of your GitHub repo (not inside any folder)

# Force non-www — http://www.wulardata.com → https://wulardata.com
[[redirects]]
  from = "http://www.wulardata.com/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

# Force non-www — https://www.wulardata.com → https://wulardata.com
[[redirects]]
  from = "https://www.wulardata.com/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

# Redirect wulardata.in to wulardata.com (bonus fix)
[[redirects]]
  from = "https://wulardata.in/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wulardata.in/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

# SPA fallback — MUST be the last rule.
# Without this, deep links like /contact or
# /data-center-services/dedicated-servers return Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
