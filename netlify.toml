# netlify.toml
# Place this file in the ROOT of your GitHub repo (not inside any folder)
# Redirect wulardata.in to wulardata.com (bonus fix)
[[redirects]]
  from = "https://wulardata.in/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wulardata.in/*"
  to = "https://wulardata.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# App routes. Every real page is served by the React app with status 200.
# IMPORTANT: when you add a new page to src/App.tsx or src/data/services.ts,
# add its path here (and to public/sitemap.xml), or it will return 404.
# ---------------------------------------------------------------------------
